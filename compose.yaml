services:

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - app

  backend:
    build: ./backend
    expose:
      - "${SERVER_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT}
      SESSION_COOKIE: ${SESSION_COOKIE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - app

  mysql:
    image: mysql:8.4
    container_name: beorganized_mysql
    
    environment:
      MYSQL_DATABASE: beorganized
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    
    ports:
      - "${MYSQL_PORT}"

    volumes:
      - mysql_data:/var/lib/mysql
    
    networks:
      - app

    
volumes:
  mysql_data: {}

networks:
  app: {}