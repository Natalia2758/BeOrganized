server.port=${SERVER_PORT}

# Default to the local developer profile unless overridden.
spring.profiles.default=dev

# Client session configuration
server.servlet.session.cookie.name=${SESSION_COOKIE}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# Load local environment overrides when running outside Docker.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Spring Java Persistance API configuration
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false
